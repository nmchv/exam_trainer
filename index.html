<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#08090b">
    <meta name="color-scheme" content="dark light">
    <meta name="description" content="Тренажёр для подготовки к экзаменам. Начните с ОГЭ по географии.">
    <title>Exam Trainer — подготовка к экзаменам</title>
    <link rel="icon" href="./public/icons/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./src/styles/global.css">
    <link rel="stylesheet" href="./src/styles/layout.css">
    <link rel="stylesheet" href="./src/styles/components.css">
    <link rel="stylesheet" href="./src/styles/responsive.css">
    <script>
      try {
        const savedTheme = localStorage.getItem('nmchv-theme');
        document.documentElement.dataset.theme = savedTheme === 'light' ? 'light' : 'dark';
      } catch {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
    <script src="./public/config.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Перейти к содержимому</a>
    <div id="app"></div>
    <noscript>Для работы тренажёра необходимо включить JavaScript.</noscript>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
